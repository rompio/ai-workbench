- repo: https://github.com/pre-commit/mirrors-flake8
  rev: v5.0.4  # Ensure the correct version
  hooks:
    - id: flake8
      args: ['--max-line-length=79']

- repo: https://github.com/python/black
  rev: 23.1.0  # Ensure the correct version
  hooks:
    - id: black
      args: ['--line-length=79']
