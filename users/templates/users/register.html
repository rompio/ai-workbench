{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
  <h2>Registrieren</h2>
  <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Registrieren</button>
  </form>
  <p class="mt-3">Schon registriert? <a href="{% url 'users:login' %}">Login</a></p>
</div>
{% endblock %}
