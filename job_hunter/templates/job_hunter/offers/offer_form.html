{% extends "base.html" %}

{% block title %}Create Offer{% endblock %}

{% block content %}
  <h2>Create a New Offer</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <br>
    <a href="{% url 'job_hunter:offer_list'%}" class="btn btn-secondary mt-3">Back</a>
  </form>
{% endblock %}
