{% extends "base.html" %}

{% block title %}Kamera hinzufügen{% endblock %}

{% block content %}
  <div class="container mt-4">
    <h2>Kamera hinzufügen</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Speichern</button>
      <a href="{% url 'cam_manager:dashboard' %}" class="btn btn-secondary">Zurück</a>
    </form>
  </div>
{% endblock %}
